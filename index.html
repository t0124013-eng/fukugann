<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>複眼ノート</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Murecho:wght@500;700;800&family=BIZ+UDPGothic:wght@400;700&family=Zen+Old+Mincho:wght@400;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
/* Layout: 1カラムのノート。セットと週を選び、週ごとの記入欄とタイマー。4週目は前3週の材料を横に置いて小論文を書く。PDFは紙の配色で別に組む。 */
:root{
  --bg:#f7f9fc; --surface:#ffffff; --ink:#13233f; --muted:#5b6a82; --line:#dbe2ec;
  --accent:#1e3a6e; --accent-ink:#ffffff; --accent-soft:#e9eef7;
  --w1:#1b2d55; --w1-soft:#e8ecf4;
  --w2:#2e5c9e; --w2-soft:#e7eff9;
  --w3:#5b7db8; --w3-soft:#eef2f9;
  --w4:#a87a22; --w4-soft:#faf3e3;
  --warn:#b42318; --ok:#2f7d4f;
  --f-display:"Murecho","Hiragino Sans","Yu Gothic",sans-serif;
  --f-body:"BIZ UDPGothic","Hiragino Sans","Yu Gothic",sans-serif;
  --f-essay:"Zen Old Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1829; --surface:#16223a; --ink:#e8eef7; --muted:#9fb0c9; --line:#2a3b5a;
  --accent:#8fb0e6; --accent-ink:#0f1829; --accent-soft:#1d2e4f;
  --w1:#9fb4dc; --w1-soft:#1c2a46; --w2:#7aa6e6; --w2-soft:#1a2c4a; --w3:#a9c0e8; --w3-soft:#1f2e4a; --w4:#e3bf6e; --w4-soft:#33291a;
  --warn:#ff8a7f; --ok:#7fd3a0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1829; --surface:#16223a; --ink:#e8eef7; --muted:#9fb0c9; --line:#2a3b5a;
  --accent:#8fb0e6; --accent-ink:#0f1829; --accent-soft:#1d2e4f;
  --w1:#9fb4dc; --w1-soft:#1c2a46; --w2:#7aa6e6; --w2-soft:#1a2c4a; --w3:#a9c0e8; --w3-soft:#1f2e4a; --w4:#e3bf6e; --w4-soft:#33291a;
  --warn:#ff8a7f; --ok:#7fd3a0; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.7}
.wrap{max-width:900px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 64px;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.35}
header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand h1{font-size:1.65rem;font-weight:800}
.brand p{margin:0;color:var(--muted);font-size:.86rem}
.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px}
.tabs button{border:0;background:transparent;color:var(--muted);font:700 .86rem var(--f-body);padding:6px 14px;border-radius:999px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
button:focus-visible,select:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
label.lbl,.lbl{display:block;font-size:.76rem;font-weight:700;letter-spacing:.06em;color:var(--muted);margin-bottom:4px}
select,input[type=text],textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
textarea{min-height:92px;resize:vertical;line-height:1.65}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row>*{flex:1 1 200px;min-width:0}
.btn{font:700 .9rem var(--f-body);border-radius:10px;padding:9px 16px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--warn);border-color:var(--warn);background:transparent}
.btn:disabled{opacity:.5;cursor:not-allowed}
.note{font-size:.8rem;color:var(--muted);margin:0}
.toast{font-size:.86rem;color:var(--accent);font-weight:700}
details.profile summary{cursor:pointer;font-weight:700;font-size:.9rem}
details.profile[open] summary{margin-bottom:12px}

/* 週ステッパー */
.weeks{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.wk{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;text-align:left;cursor:pointer;color:var(--ink);font:inherit;display:flex;flex-direction:column;gap:2px;min-width:0}
.wk b{font-family:var(--f-mono);font-size:.78rem;letter-spacing:.06em}
.wk span{font-family:var(--f-display);font-weight:700;font-size:.92rem;line-height:1.35}
.wk small{font-size:.74rem;color:var(--muted)}
.wk[aria-current="true"]{border-width:2px;padding:9px 11px}
.wk.c1 b{color:var(--w1)} .wk.c2 b{color:var(--w2)} .wk.c3 b{color:var(--w3)} .wk.c4 b{color:var(--w4)}
.wk.c1[aria-current="true"]{border-color:var(--w1);background:var(--w1-soft)}
.wk.c2[aria-current="true"]{border-color:var(--w2);background:var(--w2-soft)}
.wk.c3[aria-current="true"]{border-color:var(--w3);background:var(--w3-soft)}
.wk.c4[aria-current="true"]{border-color:var(--w4);background:var(--w4-soft)}
.wk .done{color:var(--ok);font-weight:700}
@media (max-width:560px){.weeks{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* 今週の題材 */
.brief{display:flex;flex-direction:column;gap:12px}
.chip{display:inline-flex;font:700 .8rem var(--f-display);padding:3px 10px;border-radius:999px;width:fit-content}
.q-box{border-left:5px solid currentColor;border-radius:10px;padding:10px 14px}
.q-box input{background:transparent;border:0;padding:4px 0;font:700 1.08rem var(--f-display);color:var(--ink)}
.facts{margin:0;padding-left:1.2em}
.hint{font-size:.88rem;color:var(--muted);margin:0}

/* 記入欄 */
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fields .wide{grid-column:span 2}
.fields>div{min-width:0}
@media (max-width:640px){.fields{grid-template-columns:1fr}.fields .wide{grid-column:auto}}
.save-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.fhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.fhead .lbl{margin-bottom:2px}
.desc{font-size:.84rem;color:var(--muted);margin:0 0 6px;line-height:1.6}
.hint-btn{border:1px solid var(--line);background:var(--surface);color:var(--accent);font:700 .76rem var(--f-body);cursor:pointer;padding:2px 10px;border-radius:999px;white-space:nowrap}
.hint-btn[aria-expanded="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.hintbox{background:var(--accent-soft);border-radius:10px;padding:10px 14px;margin-bottom:8px;font-size:.86rem;line-height:1.65}
.hintbox ul{margin:4px 0 0;padding-left:1.2em}
.hintbox .ex{margin-top:8px;border-top:1px dashed var(--line);padding-top:8px}
.hintbox .ex p{margin:2px 0 0;white-space:pre-wrap}
.goal{border-left:4px solid var(--accent);padding:4px 0 4px 12px;margin-bottom:14px}
.goal b{font-family:var(--f-display);font-size:.9rem}
.goal p{margin:2px 0 0;font-size:.92rem}
.memo{grid-template-columns:1fr!important}
.fixed-src{margin:0;font-weight:700}
.fixed-q{margin:0;font:700 1.05rem/1.6 var(--f-display);color:var(--ink)}
.ex-note{margin:0 0 12px;padding:10px 14px;border-radius:10px;background:var(--w4-soft);color:var(--ink);font-size:.88rem}
textarea[readonly]{background:var(--surface);color:var(--ink)}
.btn.nikkei{display:inline-flex;align-items:center;gap:6px;text-decoration:none;background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.nikkei::after{content:"↗";font-size:.85em}
/* 小論文 */
.essay-grid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:14px;align-items:start}
@media (max-width:760px){.essay-grid{grid-template-columns:1fr}}
.material{display:flex;flex-direction:column;gap:10px;max-height:640px;overflow:auto}
.mat{border-left:3px solid var(--line);padding-left:10px}
.mat h4{margin:0;font:700 .78rem var(--f-display);color:var(--muted)}
.mat p{margin:0;font-size:.88rem;white-space:pre-wrap}
.mat.c1{border-color:var(--w1)} .mat.c2{border-color:var(--w2)} .mat.c3{border-color:var(--w3)}
.memo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.memo textarea{min-height:64px;font-size:.9rem}
#essay{font-family:var(--f-essay);font-size:1.05rem;line-height:1.95;min-height:300px}
.count{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:.9rem}
.count.over{color:var(--warn)} .count.ok{color:var(--ok)}

/* TOP */
.eyebrow-s{margin:0;font:700 .76rem var(--f-mono);letter-spacing:.16em;color:var(--accent)}
.hero{display:flex;flex-direction:column;gap:8px;padding-block:8px 4px}
.hero h1{font-size:2.2rem;font-weight:800;letter-spacing:.02em}
.hero .lead{margin:0;max-width:40em;color:var(--muted)}
.flow4{list-style:none;margin:8px 0 0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.flow4 li{display:flex;flex-direction:column;gap:2px;border-top:3px solid var(--line);padding-top:6px;min-width:0}
.flow4 li:nth-child(1){border-color:var(--w1)} .flow4 li:nth-child(2){border-color:var(--w2)} .flow4 li:nth-child(3){border-color:var(--w3)} .flow4 li:nth-child(4){border-color:var(--w4)}
.flow4 b{font:600 .7rem var(--f-mono);letter-spacing:.08em;color:var(--muted)}
.flow4 span{font:700 .9rem var(--f-display)}
@media (max-width:520px){.flow4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.list-h{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
.list-h h2{font-size:1.05rem}
.list-h span{font-size:.8rem;color:var(--muted)}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.tcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0;cursor:pointer;text-align:left;color:var(--ink);font:inherit;transition:border-color .15s,transform .15s}
.tcard:hover{border-color:var(--accent);transform:translateY(-2px)}
.tcard:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.tcard .st{font:700 .74rem var(--f-body);width:fit-content;padding:2px 9px;border-radius:999px;background:var(--bg);color:var(--muted)}
.tcard .st.go{background:var(--accent-soft);color:var(--accent)}
.tcard .st.ex{background:var(--w4-soft);color:var(--w4)}
.tcard .st.fin{background:var(--w4-soft);color:var(--ok)}
.tcard h3{font-size:1.08rem;line-height:1.45}
.tcard .src{font-size:.82rem;color:var(--muted);margin:0;line-height:1.55;flex:1}
.tcard .bar{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.tcard .bar i{height:6px;border-radius:3px;background:var(--line)}
.tcard .bar i.on1{background:var(--w1)} .tcard .bar i.on2{background:var(--w2)} .tcard .bar i.on3{background:var(--w3)} .tcard .bar i.on4{background:var(--w4)}
.tcard.add{border-style:dashed;align-items:center;justify-content:center;color:var(--accent);font-weight:700;min-height:150px}
.card-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.card-actions .btn{padding:5px 12px;font-size:.8rem}
/* テーマの中 */
.set-bar{display:flex;justify-content:space-between;align-items:center;gap:8px}
.set-title h2{font-size:1.5rem;font-weight:800}
.finish{display:flex;flex-direction:column;gap:12px}
.finish.done{border-color:var(--w4);box-shadow:0 0 0 3px var(--w4-soft)}
.finish-h{display:flex;flex-direction:column;gap:2px}
.finish-h b{font-family:var(--f-display);font-size:1.05rem}
.checks{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.checks li{font-size:.84rem;padding:4px 12px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.checks li.ok{border-color:var(--ok);color:var(--ok);font-weight:700}
.checks li.ok::before{content:"✓ "}
/* セット一覧 */
.set-card{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);padding-block:14px}
.set-card:first-child{border-top:0;padding-top:0}
.set-h{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.set-h strong{font-family:var(--f-display);font-size:1.1rem}
.prog{display:flex;gap:4px}
.prog i{width:28px;height:8px;border-radius:3px;background:var(--line)}
.prog i.on{background:var(--ok)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.86rem}

/* PDF用の紙面（画面外で組む。紙なのでテーマに依存しない固定色） */
#paper{position:fixed;left:-12000px;top:0;width:794px;pointer-events:none}
.pg{width:794px;min-height:1123px;background:#ffffff;color:#1b2430;font-family:"BIZ UDPGothic","Hiragino Sans",sans-serif;position:relative;padding:64px 64px 88px;display:flex;flex-direction:column;gap:22px;font-size:12.5px;line-height:1.75}
.pg *{box-sizing:border-box}
.pg .run{position:absolute;left:64px;right:64px;top:28px;display:flex;justify-content:space-between;font-size:9.5px;letter-spacing:.12em;color:#7a8592}
.pg .foot{position:absolute;left:64px;right:64px;bottom:34px;display:flex;justify-content:space-between;align-items:center;font-size:9.5px;color:#7a8592;border-top:1px solid #dfe4ea;padding-top:10px}
.pg .foot b{font-family:"IBM Plex Mono",monospace;color:#1b2430;font-weight:600}
.pg h2{font-family:"Murecho",sans-serif;font-weight:800;font-size:26px;line-height:1.3;margin:0;color:#13233f}
.pg .eyebrow{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.2em;font-weight:600}
.pg .wkhead{display:flex;align-items:flex-end;gap:18px;padding-bottom:16px;border-bottom:2px solid #13233f}
.pg .wknum{font-family:"Murecho",sans-serif;font-weight:800;font-size:64px;line-height:.9}
.pg .wkmeta{display:flex;flex-direction:column;gap:4px;flex:1}
.pg .wkdate{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:#7a8592}
.pg .qcard{border-radius:8px;padding:14px 18px;display:flex;flex-direction:column;gap:6px}
.pg .qcard .t{font-size:10.5px;font-weight:700;letter-spacing:.08em}
.pg .qcard .src{font-size:12px;color:#3d4855}
.pg .qcard .q{font-family:"Murecho",sans-serif;font-weight:700;font-size:16px;line-height:1.55;color:#13233f}
.pg .grid{display:flex;flex-wrap:wrap;gap:14px 22px}
.pg .blk{width:322px;min-width:0}
.pg .blk.wide{width:100%}
.pg .blk .k{margin-bottom:6px}
.pg .blk .k{display:flex;align-items:center;gap:8px;font-size:10.5px;font-weight:700;letter-spacing:.06em;color:#4a5563}
.pg .blk .k i{display:inline-block;width:14px;height:3px;border-radius:2px}
.pg .blk .v{white-space:pre-wrap;word-break:break-word;border:1px solid #e3e8ee;background:#f7f9fb;border-radius:6px;padding:10px 12px;min-height:44px}
.pg .blk .v.empty{color:#a2acb7}
.pg .stance{border:1.5px solid #13233f;border-radius:8px;padding:14px 18px;display:flex;flex-direction:column;gap:4px}
.pg .stance .k{font-size:10.5px;font-weight:700;letter-spacing:.08em}
.pg .stance .v{font-family:"Murecho",sans-serif;font-weight:700;font-size:14px;line-height:1.6;white-space:pre-wrap}
/* 表紙 */
.pg.cover{padding:0;gap:0}
.cv-top{background:#13233f;color:#eef2f6;padding:72px 64px 56px;position:relative;overflow:hidden;min-height:520px;display:flex;flex-direction:column;gap:18px;justify-content:flex-end}
.cv-ring{position:absolute;border-radius:50%;border:3px solid}
.cv-top .lab{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.24em;color:#8fb4ea;position:absolute;top:56px;left:64px}
.cv-top h1{font-family:"Murecho",sans-serif;font-weight:800;font-size:40px;line-height:1.3;margin:0;color:#ffffff;max-width:600px}
.cv-top .sub{font-size:13px;color:#b9c6d3;max-width:560px}
.cv-body{padding:40px 64px 96px;display:flex;flex-direction:column;gap:28px;flex:1}
.cv-info{display:flex;flex-wrap:wrap;border-top:1px solid #13233f}
.cv-info div{width:546px}
.cv-info div.k{width:120px}
.cv-info div{padding:10px 0;border-bottom:1px solid #dfe4ea;font-size:13px}
.cv-info .k{font-size:10.5px;font-weight:700;letter-spacing:.1em;color:#7a8592;padding-top:12px}
.cv-flow{display:flex;gap:10px}
.cv-flow .cv-step{flex:1 1 0;min-width:0}
.cv-step{border-top:4px solid;padding-top:10px;display:flex;flex-direction:column;gap:4px}
.cv-step b{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.14em}
.cv-step span{font-family:"Murecho",sans-serif;font-weight:700;font-size:13px;line-height:1.4;color:#13233f}
.cv-step small{font-size:10px;color:#7a8592}
.pg.essaypg{gap:14px}
.cv-abs{border-left:4px solid #a87a22;padding:2px 0 2px 16px;display:flex;flex-direction:column;gap:4px}
.cv-abs .k{font-size:10.5px;font-weight:700;letter-spacing:.1em;color:#a87a22}
.cv-abs .v{font-family:"Zen Old Mincho",serif;font-size:15px;line-height:1.8;color:#13233f}
.pg .srcs{margin-top:auto;border-top:1px solid #dfe4ea;padding-top:10px;font-size:9.5px;color:#4a5563;line-height:1.5}
.pg .srcs b{display:block;font-size:9.5px;letter-spacing:.1em;color:#7a8592;margin-bottom:4px}
.pg .srcs div{margin-bottom:4px}
.pg .srcs span{font-family:"IBM Plex Mono",monospace;color:#7a8592;word-break:break-all}
/* 2週を1枚に収める紙面 */
.pg.pair{gap:0;padding:58px 56px 76px}
.pg.pair .run,.pg.pair .foot{left:56px;right:56px}
.pg.pair .sec{display:flex;flex-direction:column;gap:9px}
.pg.pair .sec-rule{height:1px;background:#dfe4ea;margin:16px 0}
.pg.pair .wkhead{gap:12px;padding-bottom:8px;border-bottom-width:1.5px}
.pg.pair .wknum{font-size:40px}
.pg.pair h2{font-size:18px}
.pg.pair .eyebrow{font-size:9.5px}
.pg.pair .qcard{padding:8px 14px;gap:3px;border-radius:6px}
.pg.pair .qcard .t{display:inline-block;width:34px;font-size:9.5px;font-weight:700;letter-spacing:.06em}
.pg.pair .qcard .src{font-size:11px}
.pg.pair .qcard .q{font-size:13px;line-height:1.5}
.pg.pair .grid{gap:9px 18px}
.pg.pair .blk{width:332px}
.pg.pair .blk.wide{width:100%}
.pg.pair .blk .k{font-size:9.5px;margin-bottom:3px}
.pg.pair .blk .v{font-size:11px;line-height:1.6;padding:6px 10px;min-height:30px}
.pg.pair .stance{padding:8px 14px}
.pg.pair .stance .k{font-size:9.5px}
.pg.pair .stance .v{font-size:12.5px;line-height:1.55}
.pg.pair .prompt{padding:9px 16px}
.pg.pair .prompt .q{font-size:12.5px;line-height:1.55}
.pg.pair .memo4 div{font-size:10px;padding:6px 8px;min-height:0}

        essay:"　私は、日本で金利が緩やかに上がり続けることは、賃金の上昇が伴う限り、若い世代にとって望ましいと考える。\n　現在、日本では物価の上昇が続き、円安で輸入品も高くなっている。日銀が政策金利を一・二五％に引き上げたのは、この物価上昇を抑えるためだ。利上げで得をするのは預金を多く持つ高齢世帯であり、住宅ローンや借入を抱える若い世代は負担が増える。\n　確かに、これから借りる側になる若者にとって、利上げは不利に見える。しかし、金利を低く抑えたまま物価上昇を放置すれば、給料の実質的な価値が下がり続け、長い目で見れば若い世代の生活の方が苦しくなる。重要なのは急な引き上げを避け、賃上げと歩調を合わせることである。\n　この問題は、数年後の私たちの生活にも直結する。進学や一人暮らしで奨学金や家賃を負担する立場になれば、金利の変化は家計に響く。目先の負担だけで判断せず、賃金や物価と合わせて金利を見る視点を持ちたい。"}}}},

// ---------- セット選択 ----------
$("new-cancel").onclick=()=>{$("new-set").hidden=true;$("new-title").value=""};
$("new-ok").onclick=()=>{const t=$("new-title").value.trim();if(!t){$("new-title").focus();return}const s=blankSet(t);sets.unshift(s);persist();$("new-set").hidden=true;$("new-title").value="";openSet(s.id)};

// ---------- 進み具合 ----------
function weekDone(s,n){const v=s.weeks[n].v||{};if(n===4)return (v.essay||"").replace(/\s/g,"").length>=Math.round(LIMIT*.6);return WEEKS[n].fields.filter(f=>(v[f[0]]||"").trim()).length>=Math.ceil(WEEKS[n].fields.length*.6)}
function firstOpenWeek(s){for(const n of [1,2,3,4])if(!weekDone(s,n))return n;return 4}

function renderWeeks(){
  const s=S();
  $("weeks").innerHTML=[1,2,3,4].map(n=>`<button class="wk c${n}" data-w="${n}" aria-current="${n===week}"><b>WEEK ${n}</b><span>${WEEKS[n].short}</span><small>${weekDone(s,n)?'<span class="done">記入済み</span>':(s.weeks[n].date?"記入中":"未記入")}</small></button>`).join("");
}
$("weeks").addEventListener("click",e=>{const b=e.target.closest(".wk");if(!b)return;week=+b.dataset.w;persist();renderAll()});

// ---------- 題材 ----------
function linksHtml(s){
  const kw=s.kw||s.title;
  return `<div><a class="btn nikkei" href="https://www.nikkei.com/search?keyword=${encodeURIComponent(kw)}" target="_blank" rel="noopener">日経電子版で記事を探す</a></div>`;
}
function renderBrief(){
  const s=S(),w=s.weeks[week],W=WEEKS[week],lock=s.preset;
  const col=`var(--w${week})`,soft=`var(--w${week}-soft)`;
  const lockNote=lock?`<p class="hint">このテーマの題材と問いは先生が設定したもので、変更できません。</p>`:"";
  if(week===4){
    $("brief").innerHTML=`<span class="chip" style="color:${col};background:${soft}">WEEK 4 ｜ 小論文（${LIMIT}字）</span>
     <div class="q-box" style="color:${col};background:${soft}"><span class="lbl" style="color:${col}">設問</span>${lock?`<p class="fixed-q">${esc(w.prompt)}</p>`:`<textarea id="b-prompt" aria-label="設問" style="background:transparent;border:0;padding:0;min-height:72px;font:700 1rem var(--f-display);color:var(--ink)">${esc(w.prompt)}</textarea>`}</div>
     <p class="hint">型：①主張（条件付きの結論）→ ②根拠 → ③反論と応答 → ④結論。左の材料は第1〜3週の自分の記入です。</p>`;
    if(!lock)$("b-prompt").addEventListener("input",e=>{w.prompt=e.target.value;touch()});
    return;
  }
  $("brief").innerHTML=`<span class="chip" style="color:${col};background:${soft}">WEEK ${week} ｜ ${W.role} ｜ ${W.lens}</span>
   ${lock?`<div><span class="lbl">今週の記事・題材</span><p class="fixed-src">${esc(w.src)}</p></div>`:`<div><label class="lbl" for="b-src">今週の記事・題材（スライドを見て入力）</label><input type="text" id="b-src" value="${esc(w.src)}" placeholder="例：日経電子版の記事タイトル"></div>`}
   <div class="q-box" style="color:${col};background:${soft}">${lock?`<span class="lbl" style="color:${col}">今週の問い</span><p class="fixed-q">${esc(w.q)}</p>`:`<label class="lbl" for="b-q" style="color:${col}">今週の問い</label><input type="text" id="b-q" value="${esc(w.q)}">`}</div>
   ${w.facts.length?`<div><span class="lbl">押さえておきたい事実</span><ul class="facts">${w.facts.map(f=>`<li>${esc(f)}</li>`).join("")}</ul></div>`:""}${linksHtml(s)}${lockNote}`;
  if(!lock){$("b-src").addEventListener("input",e=>{w.src=e.target.value;touch()});$("b-q").addEventListener("input",e=>{w.q=e.target.value;touch()})}
}

// ---------- 記入欄 ----------
function helpBlock(k,n){
  const H=HELP[n]?.[k];if(!H)return "";
  const ex=!S().example?(PRESETS[0].weeks[n]?.v?.[k]||"").trim():"";
  return `<p class="desc">${esc(H.d)}</p>
   <div class="hintbox" id="hint-${k}" hidden><b>つまずいたら</b><ul>${H.h.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>${ex?`<div class="ex"><b>記入例（テーマ「金利のある世界」）</b><p>${esc(ex)}</p></div>`:""}</div>`;
}
function fieldHtml(k,l,cls,n,ph=""){
  return `<div class="${cls}"><div class="fhead"><label class="lbl" for="f-${k}">${l}</label><button type="button" class="hint-btn" data-hint="${k}" aria-expanded="false" aria-controls="hint-${k}">ヒント</button></div>${helpBlock(k,n)}<textarea id="f-${k}" data-k="${k}" placeholder="${esc(ph)}" ${S().example?"readonly":""}>${esc(S().weeks[n].v[k]||"")}</textarea></div>`;
}
function renderWork(){
  const s=S(),w=s.weeks[week],v=w.v;
  const goal=(s.example?`<p class="ex-note">これは記入例です。書き方の見本として読むためのもので、書き換えはできません。自分で書くときはTOPから別のテーマを選んでください。</p>`:"")+`<div class="goal"><b>この週でやること</b><p>${esc(GOAL[week])}</p></div>`;
  if(week<4){
    $("work").innerHTML=goal+`<div class="fields">${WEEKS[week].fields.map(([k,l,wide])=>fieldHtml(k,l,wide?"wide":"",week)).join("")}</div>`;
  }else{
    const mat=[[1,"fact","第1週 事実"],[1,"issue","第1週 論点"],[2,"axis","第2週 対立軸"],[2,"stance","第2週 自分の立場"],[3,"line","第3週 自分の線"],[3,"counter","第3週 反対側の主張"],[3,"reply","第3週 応答"]];
    const EH=HELP[4].essay;
    $("work").innerHTML=goal+`<div class="essay-grid">
      <aside class="material"><span class="lbl">材料（第1〜3週の自分の記入）</span>${mat.map(([n,k,l])=>`<div class="mat c${n}"><h4>${l}</h4><p>${esc((s.weeks[n].v[k]||"").trim()||"（未記入）")}</p></div>`).join("")}</aside>
      <div style="display:flex;flex-direction:column;gap:12px;min-width:0">
        <span class="lbl">構成メモ（2分）</span>
        <div class="memo">${MEMO.map(([k,l,h])=>fieldHtml(k,l,"",4,h)).join("")}</div>
        <div class="fhead"><label class="lbl" for="essay">本文（${LIMIT}字以内）</label><span style="display:flex;gap:10px;align-items:baseline"><span class="count" id="count"></span><button type="button" class="hint-btn" data-hint="essay" aria-expanded="false" aria-controls="hint-essay">ヒント</button></span></div>
        <p class="desc">${esc(EH.d)}</p>
        <div class="hintbox" id="hint-essay" hidden><b>つまずいたら</b><ul>${EH.h.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>${!s.example?`<div class="ex"><b>記入例の第1段落（テーマ「金利のある世界」）</b><p>${esc(PRESETS[0].weeks[4].v.essay.split("\n")[0])}</p></div>`:""}</div>
        <textarea id="essay" data-k="essay" placeholder="ここに本文を書く。" ${s.example?"readonly":""}>${esc(v.essay||"")}</textarea>
      </div></div>`;
    updateCount();
  }
  $("work").querySelectorAll("textarea[data-k]").forEach(t=>t.addEventListener("input",e=>{v[e.target.dataset.k]=e.target.value;if(e.target.id==="essay")updateCount();touch()}));
  $("work").querySelectorAll(".hint-btn").forEach(b=>b.addEventListener("click",()=>{const box=$("hint-"+b.dataset.hint),open=box.hidden;box.hidden=!open;b.setAttribute("aria-expanded",open);b.textContent=open?"ヒントを閉じる":"ヒント"}));
}
const charLen=t=>(t||"").replace(/\r?\n/g,"").length;
function updateCount(){const n=charLen($("essay").value),c=$("count");c.textContent=`${n} / ${LIMIT}字`;c.className="count"+(n>LIMIT?" over":n>=LIMIT*.8?" ok":"");if(n>LIMIT)c.textContent+=`（${n-LIMIT}字オーバー）`}
let saveT;
function touch(){const w=S().weeks[week];if(!w.date)w.date=today();clearTimeout(saveT);saveT=setTimeout(()=>{persist();renderWeeks();updatePdfBar()},400)}

// ---------- TOP ----------
let downloads=null;
(async()=>{try{downloads=await window.claude?.use?.("downloads")}catch(e){downloads=null}
  if(!downloads&&!window.claude){downloads={save:({filename,data})=>new Promise(res=>{const u=URL.createObjectURL(data),a=document.createElement("a");a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);res({status:"saved"})})}}
  renderTop();updatePdfBar()})();
function card(s){
  const done=[1,2,3,4].map(n=>weekDone(s,n)),nd=done.filter(Boolean).length,started=hasInput(s);
  const st=s.example?'<span class="st ex">記入例</span>':isComplete(s)?'<span class="st fin">完成</span>':started?`<span class="st go">取り組み中 ${nd}/4週</span>`:'<span class="st">未着手</span>';
  const actions=[];
  if(isComplete(s)&&!s.example&&downloads)actions.push('<button class="btn" data-act="pdf">PDFを書き出す</button>');
  if(!s.preset)actions.push('<button class="btn danger" data-act="del">削除</button>');
  else if(started&&!s.example)actions.push('<button class="btn ghost" data-act="del">記入を消す</button>');
  return `<div class="tcard" role="button" tabindex="0" data-id="${esc(s.id)}">${st}<h3>${esc(s.title)}</h3><p class="src">${esc(s.weeks[1].src||"題材は先生の指示に合わせて入力します")}</p><div class="bar">${done.map((d,i)=>`<i class="${d?"on"+(i+1):""}"></i>`).join("")}</div>${actions.length?`<div class="card-actions">${actions.join("")}<span class="toast" data-msg></span></div>`:""}</div>`;
}
function renderTop(){
  const going=sets.filter(s=>!s.example&&(hasInput(s)||!s.preset));
  const ex=sets.filter(s=>s.example);
  const rest=sets.filter(s=>s.preset&&!s.example&&!hasInput(s));
  $("top-lists").innerHTML=
   (going.length?`<div><div class="list-h"><h2>取り組み中</h2><span>${going.length}件</span></div><div class="tgrid">${going.map(card).join("")}</div></div>`:"")+
   `<div><div class="list-h"><h2>テーマを選ぶ</h2><span>${rest.length+ex.length}本</span></div><div class="tgrid">${ex.map(card).join("")}${rest.map(card).join("")}<button class="tcard add" id="add-card">＋ 先生が出したテーマで始める</button></div></div>`;
}
$("top-lists").addEventListener("click",async e=>{
  if(e.target.closest("#add-card")){$("new-set").hidden=false;$("new-title").focus();return}
  const c=e.target.closest(".tcard");if(!c)return;const id=c.dataset.id,s=sets.find(x=>x.id===id);const b=e.target.closest("button");
  if(!b){openSet(id);return}
  const msg=c.querySelector("[data-msg]");e.stopPropagation();
  if(b.dataset.act==="pdf"){b.disabled=true;msg.textContent="作成中…";try{await makePdf(s);msg.textContent="保存しました"}catch(err){msg.textContent=err?.code==="declined"?"やめました":"保存できませんでした"}b.disabled=false}
  if(b.dataset.act==="del"){b.closest(".card-actions").innerHTML=`<span class="confirm">${s.preset?"記入を消しますか？":"このテーマを削除しますか？"} <button class="btn danger" data-act="yes">${s.preset?"消す":"削除"}</button><button class="btn ghost" data-act="no">やめる</button></span>`}
  if(b.dataset.act==="no")renderTop();
  if(b.dataset.act==="yes"){if(s.preset){const p=PRESETS.find(x=>x.id===id);sets[sets.indexOf(s)]=blankSet(p.title,p)}else sets=sets.filter(x=>x.id!==id);persist();renderTop()}
});
$("top-lists").addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.classList?.contains("tcard")&&e.target.dataset.id){e.preventDefault();openSet(e.target.dataset.id)}});
function openSet(id){cur=id;week=firstOpenWeek(S());persist();$("view-top").hidden=true;$("view-set").hidden=false;renderAll();window.scrollTo(0,0)}
function goTop(){persist();$("view-set").hidden=true;$("view-top").hidden=false;renderTop();window.scrollTo(0,0)}
$("back").onclick=goTop;
function readiness(s){const n=charLen(s.weeks[4].v.essay);return [["第1週を記入",weekDone(s,1)],["第2週を記入",weekDone(s,2)],["第3週を記入",weekDone(s,3)],[`小論文 ${Math.round(LIMIT*.8)}字以上（いま${n}字）`,n>=LIMIT*.8],[`${LIMIT}字以内`,n>0&&n<=LIMIT]]}
const isComplete=s=>readiness(s).every(r=>r[1]);
function updatePdfBar(){
  const f=$("finish");if(!f)return;const s=S();f.hidden=week!==4;if(week!==4)return;
  const r=readiness(s),ok=r.every(x=>x[1]),left=r.filter(x=>!x[1]).length;
  $("checks").innerHTML=r.map(([l,v])=>`<li class="${v?"ok":""}">${esc(l)}</li>`).join("");
  f.classList.toggle("done",ok);
  $("finish-title").textContent=ok?"完成です":"完成チェック";
  $("finish-sub").textContent=ok?"4週分がそろいました。成果レポートをPDFで書き出して提出してください。":`すべてそろうと、成果レポートをPDFで書き出せます（残り${left}項目）。`;
  $("pdf-btn").disabled=!ok||!downloads;
  if(ok&&!downloads)$("pdf-msg").textContent="この画面ではPDF保存が使えません。Claudeのアプリかブラウザで開いてください。";
}
$("pdf-btn").onclick=async()=>{const b=$("pdf-btn"),m=$("pdf-msg");b.disabled=true;m.textContent="PDFを作成中…";try{await makePdf(S());m.textContent="保存しました"}catch(err){m.textContent=err?.code==="declined"?"保存をやめました":"保存できませんでした。もう一度お試しください"}b.disabled=false};

// ---------- PDF ----------
const COL={1:["#1b2d55","#eef1f7"],2:["#2e5c9e","#edf3fb"],3:["#5b7db8","#f1f4fa"],4:["#a87a22","#fbf5e8"]};
const val=t=>{t=(t||"").trim();return t?`<div class="v">${esc(t)}</div>`:`<div class="v empty">（未記入）</div>`};
function pageFrame(inner,n,total,s,cls=""){return `<div class="pg ${cls}"><div class="run"><span>複眼思考トレーニング｜成果レポート</span><span>${esc(s.title)}</span></div>${inner}<div class="foot"><span>朝礼 × 日経電子版</span><span><b>${n}</b> / ${total}</span></div></div>`}
function coverPage(s,p){
  const dates=[1,2,3,4].map(n=>s.weeks[n].date).filter(Boolean);
  const period=dates.length?`${dates[0]} 〜 ${dates[dates.length-1]}`:"—";
  return `<div class="pg cover"><div class="cv-top">
    <div class="cv-ring" style="width:330px;height:330px;right:-40px;top:-60px;border-color:#3b5a8c"></div>
    <div class="cv-ring" style="width:330px;height:330px;right:-150px;top:40px;border-color:#5b7db8"></div>
    <div class="lab">MULTI-PERSPECTIVE THINKING ｜ REPORT</div>
    <div style="font-size:12px;color:#8fb4ea;font-weight:700;letter-spacing:.12em">複眼思考トレーニング 成果レポート</div>
    <h1>${esc(s.title)}</h1>
    <div class="sub">日本経済新聞電子版の記事を素材に、4週間かけて一つのテーマを「事実 → 利害 → 線引き → 自分の結論」の順で掘り下げた記録です。</div>
  </div>
  <div class="cv-body">
    <div class="cv-info">
      <div class="k">氏名</div><div style="font-family:Murecho,sans-serif;font-weight:700;font-size:17px">${esc(p.name)||"　"}</div>
      <div class="k">クラス・番号</div><div>${esc(p.cls)||"—"}　${p.no?esc(p.no)+"番":""}</div>
      
      <div class="k">実施期間</div><div style="font-family:'IBM Plex Mono',monospace">${period}</div>
    </div>
    ${(s.weeks[4].v.m1||"").trim()?`<div class="cv-abs"><div class="k">わたしの結論（要旨）</div><div class="v">${esc(s.weeks[4].v.m1.trim())}</div></div>`:""}
    <div style="display:flex;flex-direction:column;gap:12px">
      <div class="eyebrow" style="color:#7a8592">4 WEEKS ｜ 構成</div>
      <div class="cv-flow">${[1,2,3,4].map(n=>`<div class="cv-step" style="border-color:${COL[n][0]}"><b style="color:${COL[n][0]}">WEEK ${n}</b><span>${WEEKS[n].role}</span><small>${WEEKS[n].lens}</small></div>`).join("")}</div>
    </div>
    <div class="foot"><span>朝礼 × 日経電子版</span><span>作成日 ${today()}</span></div>
  </div></div>`;
}
function weekSection(s,n){
  const w=s.weeks[n],W=WEEKS[n],[c,soft]=COL[n],v=w.v;
  const fl=W.fields.filter(f=>f[0]!=="stance").map(f=>[...f]);
  const halves=fl.filter(f=>!f[2]);if(halves.length%2===1)halves[halves.length-1][2]=true;
  const blocks=fl.map(([k,l,wide])=>`<div class="blk ${wide?"wide":""}"><div class="k"><i style="background:${c}"></i>${l}</div>${val(v[k])}</div>`).join("");
  const stance=n===2?`<div class="stance" style="border-color:${c}"><div class="k" style="color:${c}">この週の着地 ｜ 現時点の自分の立場</div><div class="v">${esc((v.stance||"").trim()||"（未記入）")}</div></div>`:"";
  return `<section class="sec">
    <div class="wkhead"><div class="wknum" style="color:${c}">0${n}</div><div class="wkmeta"><div class="eyebrow" style="color:${c}">WEEK ${n} ｜ ${W.lens}</div><h2>${W.role}</h2></div><div class="wkdate">${w.date||""}</div></div>
    <div class="qcard" style="background:${soft};border-left:4px solid ${c}">
      <div class="src"><span class="t" style="color:${c}">題材</span>${esc(w.src)||"—"}</div>
      <div class="q"><span class="t" style="color:${c}">問い</span>${esc(w.q)}</div>
    </div>
    <div class="grid">${blocks}</div>${stance}</section>`;
}
function essaySection(s){
  const w=s.weeks[4],v=w.v,n=charLen(v.essay),c=COL[4][0];
  return `<section class="sec">
    <div class="wkhead"><div class="wknum" style="color:${c}">04</div><div class="wkmeta"><div class="eyebrow" style="color:${c}">WEEK 4 ｜ 小論文</div><h2>自分の結論を書く</h2></div><div class="wkdate">${w.date||""}</div></div>
    <div class="prompt"><div class="t">設問</div><div class="q">${esc(w.prompt)}</div></div>
    <div class="memo4">${MEMO.map(([k,l])=>`<div><b>${l}</b>${esc((v[k]||"").trim())}</div>`).join("")}</div>
    <div class="essay">${esc((v.essay||"").trim())||"（未記入）"}</div>
    <div class="ecount"><span>本文（${LIMIT}字以内）</span><span><b>${n}</b> 字</span></div></section>`;
}
function pairPage(s,a,b,pn,tot){
  return pageFrame(`${a===1?weekSection(s,1):weekSection(s,3)}<div class="sec-rule"></div>${a===1?weekSection(s,2):essaySection(s)}`,pn,tot,s,"pair");
}
async function makePdf(s){
  if(!window.html2canvas||!window.jspdf)throw {code:"lib"};
  try{await document.fonts.ready}catch(e){}
  const p=prof(),tot=3;
  const pages=[coverPage(s,p),pairPage(s,1,2,2,tot),pairPage(s,3,4,3,tot)];
  const paper=$("paper");const {jsPDF}=window.jspdf;const pdf=new jsPDF({unit:"mm",format:"a4",compress:true});
  for(let i=0;i<pages.length;i++){
    paper.innerHTML=pages[i];const el=paper.firstElementChild;
    const canvas=await html2canvas(el,{scale:2,backgroundColor:"#ffffff",useCORS:true,logging:false,windowWidth:794});
    const img=canvas.toDataURL("image/jpeg",0.92);
    const ratio=canvas.height/canvas.width, hmm=210*ratio;
    if(i>0)pdf.addPage();
    if(hmm<=297.5)pdf.addImage(img,"JPEG",0,0,210,hmm);
    else{const w=297/ratio;pdf.addImage(img,"JPEG",(210-w)/2,0,w,297)}
  }
  paper.innerHTML="";
  const blob=pdf.output("blob");
  const name=`複眼レポート_${s.title}_${p.name||"氏名未入力"}.pdf`.replace(/[\\/:*?"<>|]/g,"");
  return downloads.save({filename:name,data:blob});
}

// ---------- タブ ----------
function renderAll(){const s=S();$("set-name").textContent=s.title;$("set-kind").textContent=s.example?"記入例のテーマ":"テーマ";renderWeeks();renderBrief();renderWork();updatePdfBar()}
renderTop();
</script>

</body>
